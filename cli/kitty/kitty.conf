# Color scheme
# default_theme.conf is just a neutral placeholder used before pywal16 has
# generated anything. colors-kitty.conf (from pywal16) is included after,
# so it fully overrides this with your wallpaper's real palette. run
# `wal -i /path/to/image` once to generate it, then every wallpaper change
# after that keeps this in sync automatically.
include default_theme.conf
include ~/.cache/wal/colors-kitty.conf

# Font settings
font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

# Background and transparency
background_opacity 0.85

# Window settings
confirm_os_window_close 0

# Cursor settings
cursor_shape beam
cursor_trail 1

# Shell and other settings
shell /usr/bin/zsh
enable_graphics yes
window_padding_width 5 10

allow_remote_control yes
listen_on unix:/tmp/mykitty

