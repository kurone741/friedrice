background {
    path = ~/dotfiles/walls/blue-koi-girl.png
    blur_passes = 4 
    blur_size = 8
    blur_vibrancy = 3
}

input-field {
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 
    dots_spacing = 0.15 
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

# Current Time Label
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +\%H:%M\) </big></b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}

